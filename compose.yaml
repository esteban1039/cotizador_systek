name: systek
services:
  api:
    build: ./backend
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./backend:/app
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: systek
      DB_USERNAME: systek
      DB_PASSWORD: local-development-only
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: systek
      POSTGRES_USER: systek
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U systek -d systek']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
